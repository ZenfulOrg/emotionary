plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.emotionarypurchases'
version = '0.1.0'

android {
  namespace "expo.modules.emotionarypurchases"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'com.android.billingclient:billing:9.1.0'
}
